name: Deploy to Amazon EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: foodiefy-eks-cluster
  BACKEND_IMAGE_NAME: 344121726204.dkr.ecr.us-east-1.amazonaws.com/foodiefy-backend
  FRONTEND_IMAGE_NAME: 344121726204.dkr.ecr.us-east-1.amazonaws.com/foodiefy-frontend

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t $BACKEND_IMAGE_NAME:${{ github.sha }} -t $BACKEND_IMAGE_NAME:latest ./backend
          docker push $BACKEND_IMAGE_NAME:${{ github.sha }}
          docker push $BACKEND_IMAGE_NAME:latest

      - name: Build and push frontend image
        run: |
          docker build -t $FRONTEND_IMAGE_NAME:${{ github.sha }} -t $FRONTEND_IMAGE_NAME:latest ./frontend
          docker push $FRONTEND_IMAGE_NAME:${{ github.sha }}
          docker push $FRONTEND_IMAGE_NAME:latest

      - name: Update KubeConfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment backend -n food-app
          kubectl rollout restart deployment frontend -n food-app
